name: Relay fork checks
on:
  push:
    branches: [custom/main, 'integration/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-relay:
    runs-on: ubuntu-latest
    env:
      CODEX_LB_DATA_DIR: ${{ runner.temp }}/relay-db
      OPENSPEC_TELEMETRY: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: uv sync --frozen --all-extras --dev
      - run: uv run python -m scripts.check_relay_source
      - run: |
          mkdir -p "$CODEX_LB_DATA_DIR"
          uv run codex-lb-db upgrade head
          uv run codex-lb-db check
      - run: >-
          uv run ruff check app/modules/virtual_accounts app/modules/provider_billing
          app/modules/visitor_access app/modules/codex_config app/modules/provider_compatibility
          scripts/check_relay_source.py scripts/import_relay_visitors.py scripts/smoke_relay_http.py
      - run: >-
          uv run ty check app/modules/virtual_accounts app/modules/provider_billing
          app/modules/visitor_access app/modules/codex_config app/modules/provider_compatibility
      - run: >-
          uv run pytest tests/unit/test_relay_provider_billing.py
          tests/integration/test_relay_native.py tests/unit/test_source_dispatch.py
          tests/integration/test_model_source_dispatch.py -q
      - working-directory: frontend
        run: bun install --frozen-lockfile
      - working-directory: frontend
        run: bun run test src/features/codex-config/commands.test.ts src/features/visitor-access/relay-access.test.tsx
      - working-directory: frontend
        run: bun run build
      - run: npx --yes @fission-ai/openspec validate --specs --strict
