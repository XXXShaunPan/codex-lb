name: Relay fork checks
on:
  push:
    branches: [custom/main, 'integration/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-relay:
    runs-on: ubuntu-latest
    env:
      CODEX_LB_DATA_DIR: ${{ github.workspace }}/.codex-lb-relay-ci
      OPENSPEC_TELEMETRY: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: uv sync --frozen --all-extras --dev
      - run: uv run python -m scripts.check_relay_source
      - run: |
          mkdir -p "$CODEX_LB_DATA_DIR"
          uv run codex-lb-db upgrade head
          uv run codex-lb-db check
      - run: >-
          uv run ruff check app/modules/virtual_accounts app/modules/provider_billing
          app/modules/visitor_access app/modules/codex_config app/modules/provider_compatibility app/modules/relay_routing app/modules/image_routing
          scripts/check_relay_source.py scripts/import_relay_visitors.py scripts/smoke_relay_http.py
      - run: >-
          uv run ty check app/modules/virtual_accounts app/modules/provider_billing
          app/modules/visitor_access app/modules/codex_config app/modules/provider_compatibility app/modules/relay_routing app/modules/image_routing
      - run: >-
          uv run pytest tests/unit/test_relay_provider_billing.py
          tests/integration/test_relay_native.py tests/unit/test_source_dispatch.py
          tests/integration/test_model_source_dispatch.py tests/unit/test_custom_weighted_routing.py
          tests/integration/test_custom_routing_weights_api.py tests/integration/test_custom_routing_weight_migration.py
          tests/unit/test_priority_routing.py tests/integration/test_priority_routing.py tests/integration/test_priority_routing_migration.py
          tests/unit/test_load_balancer.py tests/unit/test_load_balancer_concurrency.py -q
      - run: >-
          uv run pytest tests/integration/test_codex_token_pool.py tests/integration/test_config_images_migration.py
          tests/integration/test_relay_image_routing.py tests/integration/test_proxy_images.py
          tests/unit/test_images_translation.py tests/unit/test_api_keys_service.py -q
      - run: >-
          uv run pytest tests/integration/test_api_keys_api.py tests/unit/test_proxy_api_usage.py
          tests/integration/test_request_logs_api.py tests/integration/test_request_logs_filters.py -q
      - working-directory: frontend
        run: bun install --frozen-lockfile
      - working-directory: frontend
        run: bun run test src/features/codex-config/commands.test.ts src/features/codex-config/copy-command.test.tsx src/utils/clipboard.test.ts src/components/copy-button.test.tsx src/features/visitor-access/relay-access.test.tsx src/features/image-routing/image-settings.test.tsx src/features/relay-routing/weight-settings.test.tsx src/features/relay-routing/priority-settings.test.tsx src/features/settings/components/routing-settings.test.tsx
      - working-directory: frontend
        run: bun run build
      # Keep the CLI used to validate the upstream spec baseline reproducible.
      - run: npx --yes @fission-ai/openspec@1.13.1 validate --specs --strict
  native-config-commands:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Python is only the test oracle, never a generated client dependency.
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - working-directory: frontend
        run: bun install --frozen-lockfile
      - working-directory: frontend
        run: bun run test src/features/codex-config/commands.test.ts
